# Builds and tests every pull request (the test job runs tests/StickAndPuck.Tests). On each merge to main it publishes one self-contained executable per
# platform (tools/publish.sh; macOS as a zipped StickAndPuck.app), tags the commit and creates a GitHub Release with the executables and browser site ZIP.
# Versioning: a merge bumps the patch (v0.0.1 -> v0.0.2). A milestone bumps the minor (v0.0.5 -> v0.1.0):
# put [milestone] in the squash-commit message or give the PR the label "milestone". Every commit since
# the last release tag is checked, so a milestone still counts when its own run was dropped from the queue.
name: Build and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump
        type: choice
        options: [patch, minor]
        default: patch

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      number: ${{ steps.version.outputs.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pick version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_BUMP: ${{ inputs.bump }}
          MESSAGE: ${{ github.event.head_commit.message }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          bump="patch"
          if [ "$EVENT" = workflow_dispatch ]; then
            bump="$INPUT_BUMP"
          elif [ "$EVENT" = pull_request ] && grep -qi '\[milestone\]' <<< "$PR_TITLE"; then
            bump="minor"
          elif [ "$EVENT" = push ]; then
            # A queued release run is dropped when a newer merge queues behind it, so look at every
            # commit since the last release tag, not only this one, for a milestone marker or label.
            last=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
            range=${last:+$last..}$GITHUB_SHA
            if grep -qi '\[milestone\]' <<< "$MESSAGE$(git log --format=%B "$range")"; then
              bump="minor"
            else
              for sha in $(git rev-list "$range"); do
                labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" --jq '.[].labels[].name' || true)
                if grep -qix milestone <<< "$labels"; then
                  bump="minor"
                  break
                fi
              done
            fi
          fi
          tag=$(tools/next_version.sh "$bump")
          echo "Bump $bump -> $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "number=${tag#v}" >> "$GITHUB_OUTPUT"

  format:
    name: Formatting and analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-format-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json', '**/*.csproj', 'dotnet-tools.json') }}
          restore-keys: nuget-format-${{ runner.os }}-

      - name: Restore tools and solution
        run: |
          dotnet tool restore
          dotnet restore src.slnx

      - name: Check CSharpier formatting
        run: dotnet csharpier check .

      # dotnet format does not build project-referenced source generators.
      # DiscoveryRegistry must exist before unused-type analysis runs.
      - name: Build analyzers and discovery generator
        run: dotnet build analyzers/StickAndPuck.Analyzers/StickAndPuck.Analyzers.csproj --no-restore

      - name: Check Roslyn code style
        run: dotnet format style src.slnx --no-restore --verify-no-changes

      - name: Check analyzer fixes
        run: dotnet format analyzers src.slnx --no-restore --verify-no-changes

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-test-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json', '**/*.csproj', 'dotnet-tools.json') }}
          restore-keys: nuget-test-${{ runner.os }}-

      - name: Test
        run: dotnet test --project tests/StickAndPuck.Tests -c Release

  # Browser verification: the wasm site and the desktop Release build run in parallel, then one job per
  # browser, then the "Browser test" check that the release job and branch protection rely on.
  browser-site:
    name: Browser site
    needs: version
    env:
      VERSION: ${{ needs.version.outputs.number }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A job-local SDK directory, so the SDK and its wasm-tools workload are cached together.
      - name: Use a cacheable .NET directory
        run: echo "DOTNET_INSTALL_DIR=$HOME/.dotnet-wasm" >> "$GITHUB_ENV"
      # The saved key ends in a fingerprint of the installed workloads, so a new SDK (global.json) or a
      # new wasm-tools version saves a fresh cache instead of reusing a stale one.
      - name: Restore .NET SDK and wasm-tools
        id: dotnet-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.dotnet-wasm
          key: dotnet-wasm-${{ runner.os }}-${{ hashFiles('global.json') }}-
          restore-keys: dotnet-wasm-${{ runner.os }}-${{ hashFiles('global.json') }}-
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-browser-site-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json', '**/*.csproj', 'dotnet-tools.json') }}
          restore-keys: nuget-browser-site-${{ runner.os }}-
      - name: Install wasm-tools
        id: workload
        run: |
          dotnet workload install wasm-tools
          echo "fingerprint=$(dotnet workload list | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Save .NET SDK and wasm-tools
        if: steps.dotnet-cache.outputs.cache-matched-key != format('dotnet-wasm-{0}-{1}-{2}', runner.os, hashFiles('global.json'), steps.workload.outputs.fingerprint)
        uses: actions/cache/save@v6
        with:
          path: ~/.dotnet-wasm
          key: dotnet-wasm-${{ runner.os }}-${{ hashFiles('global.json') }}-${{ steps.workload.outputs.fingerprint }}
      - name: Publish browser site
        run: tools/publish.sh browser-wasm
      - name: Upload browser site
        uses: actions/upload-artifact@v7
        with:
          name: browser-site
          path: publish/browser-wasm/wwwroot
          if-no-files-found: error

  desktop-build:
    name: Desktop build
    needs: version
    env:
      VERSION: ${{ needs.version.outputs.number }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-desktop-build-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json', '**/*.csproj', 'dotnet-tools.json') }}
          restore-keys: nuget-desktop-build-${{ runner.os }}-
      # The browser jobs record and check their desktop replay fixtures with this Release build.
      - name: Build desktop Release
        run: dotnet build src/StickAndPuck.App -c Release
      - name: Upload desktop Release build
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release
          path: src/StickAndPuck.App/bin/Release/net11.0
          if-no-files-found: error
          retention-days: 1

  browser-verify:
    name: Browser test (${{ matrix.browser }})
    needs: [browser-site, desktop-build]
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/browser/package-lock.json
      # Browser binaries are cached per Playwright version (pinned in package-lock.json).
      - name: Restore Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('tools/browser/package-lock.json') }}
      - name: Install browser toolchain
        run: |
          npm ci --prefix tools/browser
          cd tools/browser
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Start virtual audio output
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=browser_test
          pactl set-default-sink browser_test
      - name: Download browser site
        uses: actions/download-artifact@v8
        with:
          name: browser-site
          path: publish/browser-wasm/wwwroot
      - name: Download desktop Release build
        uses: actions/download-artifact@v8
        with:
          name: desktop-release
          path: src/StickAndPuck.App/bin/Release/net11.0
      - name: Verify browser publish and desktop replay parity
        env:
          BROWSERS: ${{ matrix.browser }}
          BROWSER_VERIFY_PREBUILT: '1'
        run: xvfb-run -a tools/verify-browser.sh
      - name: Upload browser verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-verification-${{ matrix.browser }}
          path: TestResults/browser

  browser:
    name: Browser test
    needs: [browser-site, desktop-build, browser-verify]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the site, the desktop build and every browser to pass
        env:
          RESULTS: ${{ needs.browser-site.result }} ${{ needs.desktop-build.result }} ${{ needs.browser-verify.result }}
        run: |
          echo "Browser site, desktop build, browser verification: $RESULTS"
          [ "$RESULTS" = "success success success" ]

  # The desktop executables are published while the checks run; "Build" packages them (and the verified
  # browser site) once every check has passed, and on main creates the release.
  publish:
    name: Publish
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-publish-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json', '**/*.csproj', 'dotnet-tools.json') }}
          restore-keys: nuget-publish-${{ runner.os }}-

      - name: Publish
        env:
          VERSION: ${{ needs.version.outputs.number }}
        run: tools/publish.sh linux-x64 win-x64 osx-arm64

      # A tar keeps the executable bits that an artifact upload would drop.
      - name: Pack desktop executables
        run: tar -cf desktop-publish.tar publish/linux-x64 publish/win-x64 publish/osx-arm64

      - name: Upload desktop executables
        uses: actions/upload-artifact@v7
        with:
          name: desktop-publish
          path: desktop-publish.tar
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build
    needs: [format, test, browser, version, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download desktop executables
        uses: actions/download-artifact@v8
        with:
          name: desktop-publish

      - name: Unpack desktop executables
        run: |
          tar -xf desktop-publish.tar
          rm desktop-publish.tar
          test -x publish/linux-x64/StickAndPuck
          test -x publish/osx-arm64/StickAndPuck

      - name: Download verified browser site
        uses: actions/download-artifact@v8
        with:
          name: browser-site
          path: publish/browser-wasm/wwwroot

      - name: Package release assets
        env:
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.number }}
        run: |
          mkdir -p release
          cp publish/linux-x64/StickAndPuck "release/StickAndPuck-$TAG-linux-x64"
          cp publish/win-x64/StickAndPuck.exe "release/StickAndPuck-$TAG-win-x64.exe"
          # Windows: a GUI exe, so no console window opens (PE optional header subsystem 2).
          python3 -I - "release/StickAndPuck-$TAG-win-x64.exe" <<'PYTHON'
          import struct
          import sys

          data = open(sys.argv[1], "rb").read(4096)
          pe = struct.unpack_from("<I", data, 0x3C)[0]
          assert data[pe : pe + 4] == b"PE\0\0", "not a PE file"
          subsystem = struct.unpack_from("<H", data, pe + 24 + 68)[0]
          assert subsystem == 2, f"the Windows exe is not a GUI app (subsystem {subsystem})"
          PYTHON
          # macOS: StickAndPuck.app in a ZIP, so Finder starts it without a Terminal.
          python3 -I tools/macos_app.py publish/osx-arm64 "$VERSION" --zip "release/StickAndPuck-$TAG-osx-arm64.zip"
          python3 - <<'PYTHON'
          import os
          import shutil
          from pathlib import Path

          root = Path.cwd()
          site = root / "publish/browser-wasm/wwwroot"
          assert (site / "index.html").is_file(), "Browser launcher is missing"
          assert (site / "_framework/dotnet.js").is_file(), "Browser runtime is missing"
          archive = root / "release" / f"StickAndPuck-{os.environ['TAG']}-browser-wasm"
          shutil.make_archive(str(archive), "zip", root_dir=site)
          PYTHON
          # Every platform's asset is there, and nothing else.
          tag="$TAG"
          expected=$(printf '%s\n' "StickAndPuck-$tag-browser-wasm.zip" "StickAndPuck-$tag-linux-x64" "StickAndPuck-$tag-osx-arm64.zip" "StickAndPuck-$tag-win-x64.exe" | sort)
          actual=$(ls release | sort)
          if [ "$expected" != "$actual" ]; then
            echo "Release assets differ from the expected set:"; diff <(echo "$expected") <(echo "$actual"); exit 1
          fi

      - name: Create release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release create "$TAG" release/* --target "$GITHUB_SHA" --title "StickAndPuck $TAG" --generate-notes
